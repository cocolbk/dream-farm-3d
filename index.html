<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1E2A32" />
    <meta name="description" content="Dream Farm 3D — cozy 3D farming, building and village-shop sim for mobile and desktop browsers." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-180.png" />
    <title>Dream Farm 3D</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="main-menu" class="overlay">
        <div class="menu-card">
          <h1>🌾 Dream Farm 3D</h1>
          <p class="subtitle">Cozy farm sim — Phase 1 playable foundation</p>
          <button id="btn-continue" class="btn primary" disabled>Continue</button>
          <button id="btn-new" class="btn primary">New Game</button>
          <button id="btn-settings-menu" class="btn">Settings</button>
          <button id="btn-install" class="btn">📲 Install App</button>
        </div>
      </div>
      <div id="hud" class="hidden">
        <div id="topbar">
          <span id="coins">🪙 200</span>
          <span id="seeds-quick"></span>
          <span id="objective">Objective: plant a crop</span>
          <span id="save-dot" title="saved">●</span>
          <button id="btn-shop" class="btn small">🌱 Seeds</button>
          <button id="btn-storage" class="btn small">🧺 Storage</button>
          <button id="btn-farmshop" class="btn small">🏪 Shop</button>
          <button id="btn-customers" class="btn small">🚗 Customers</button>
          <button id="btn-staff" class="btn small">👥 Staff</button>
          <button id="btn-land" class="btn small">🗺️ Land</button>
          <button id="btn-goals" class="btn small">🏆 Goals</button>
          <button id="btn-dealer" class="btn small">🚜 Tractors</button>
          <button id="btn-fin" class="btn small">💰 Ledger</button>
          <button id="btn-install-top" class="btn small">📲 Install</button>
          <button id="btn-pause" class="btn small">II</button>
        </div>
        <div id="prompt" class="hidden"></div>
        <div id="cropbar" class="hidden">
          <button class="crop-pick" data-crop="maize">🌽 Maize</button>
          <button class="crop-pick" data-crop="carrot">🥕 Carrot</button>
          <button class="crop-pick" data-crop="tomato">🍅 Tomato</button>
          <button class="crop-pick" data-crop="wheat">🌾 Wheat</button>
          <button class="crop-pick" data-crop="pumpkin">🎃 Pumpkin</button>
        </div>
        <div id="toolbar">
          <button class="tool" data-tool="plant">🌱 Plant</button>
          <button class="tool" data-tool="water">💧 Water</button>
          <button class="tool" data-tool="harvest">🧺 Harvest</button>
          <button class="tool" data-tool="cultivate">🚜 Till</button>
          <button class="tool" data-tool="boost">✨ Boost</button>
          <button class="tool" data-tool="drive">🕹️ Drive</button>
          <button class="tool" data-tool="build">🏠 Build</button>
          <button class="tool" data-tool="interact">✋ Interact</button>
        </div>
        <div id="joystick" class="hidden">
          <button id="joy-up" class="btn">▲</button>
          <div><button id="joy-left" class="btn">◀</button><button id="joy-down" class="btn">▼</button><button id="joy-right" class="btn">▶</button></div>
          <button id="joy-exit" class="btn small">Exit drive</button>
        </div>
        <div id="panel" class="hidden">
          <div class="panel-head">
            <span id="panel-title">Panel</span>
            <button id="panel-close" class="btn small">✕</button>
          </div>
          <div id="panel-body"></div>
        </div>
        <div id="pause-menu" class="overlay hidden">
          <div class="menu-card">
            <h2>Paused</h2>
            <p id="save-status">Save: —</p>
            <label>Camera sensitivity <input id="set-sens" type="range" min="0.5" max="2" step="0.1" value="1" /></label>
            <label>Graphics
              <select id="set-gfx">
                <option value="high">High</option>
                <option value="med" selected>Med</option>
                <option value="low">Low</option>
              </select>
            </label>
            <label><input id="set-sound" type="checkbox" checked /> Sound</label>
            <div>
              <button id="btn-resume" class="btn primary">Resume</button>
              <button id="btn-reset" class="btn danger">Reset save</button>
            </div>
          </div>
        </div>
        <div id="confirm" class="overlay hidden">
          <div class="menu-card">
            <p id="confirm-text"></p>
            <button id="confirm-yes" class="btn primary">Confirm</button>
            <button id="confirm-no" class="btn">Cancel</button>
          </div>
        </div>
        <div id="toasts" aria-live="polite"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
